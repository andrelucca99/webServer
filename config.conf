server {
    listen 8080;
    host 127.0.0.1;
    root ./www;
    client_max_body_size 1M;
    error_page 404 /errors/404.html;
    error_page 403 /errors/403.html;
    error_page 413 /errors/413.html;

    location / {
        methods GET POST DELETE;
        index index.html;
        autoindex on;
    }

    location /old {
        return 301 /;
    }

    location /upload {
        methods POST;
        upload_store ./www/uploads;
    }

    location /docs {
        methods GET;
        root ./www/alt;
    }

    location /cgi-bin {
        methods GET POST;
        cgi_extension .py /usr/bin/python3;
    }
}

server {
    listen 8081;
    host 127.0.0.1;
    root ./www;
    client_max_body_size 512K;

    location / {
        methods GET;
        index index.html;
        autoindex on;
    }
}