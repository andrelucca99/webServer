server {
    listen 7000;
    host 127.0.0.1;
    root ./www;
    client_max_body_size 256K;
    error_page 404 /errors/404.html;

    location / {
        methods GET POST DELETE;
        index index.html;
    }

    location /old {
        return 301 /;
    }

    location /cgi-bin {
        methods GET POST;
        cgi_extension .py /usr/bin/python3;
    }
}

server {
    listen 7001;
    host 127.0.0.1;
    root ./www;

    location / {
        methods GET;
        autoindex on;
    }
}

server {
    listen 7002;
    host 0.0.0.0;
    root ./www/alt;

    location /docs {
        methods GET;
        root ./www/alt;
    }
}
